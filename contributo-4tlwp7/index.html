    <style>
      /* Side B: stesso meccanismo del sito (styles.css + script.js), sezioni e colori propri. */
      /* Home nell'arancione del sito; le altre sezioni in scala di grigi. */
      .side-b {
        --contributo-row: calc(var(--closed-row) + var(--contributo-banner-height, 0px));
        --location-row: calc(var(--closed-row) + var(--location-banner-height, 0px));
        --agenda-row: calc(var(--closed-row) + var(--agenda-banner-height, 0px));
        --liberatorie-row: calc(var(--closed-row) + var(--liberatorie-banner-height, 0px));
        grid-template-rows:
          var(--home-row)
          var(--contributo-row)
          var(--location-row)
          var(--agenda-row)
          var(--liberatorie-row);
      }
      .side-b[data-active="contributo"] { --contributo-row: 1fr; }
      .side-b[data-active="location"] { --location-row: 1fr; }
      .side-b[data-active="agenda"] { --agenda-row: 1fr; }
      .side-b[data-active="liberatorie"] { --liberatorie-row: 1fr; }
      .side-b [data-panel="home"] { --panel-color: var(--home); }
      .side-b [data-panel="contributo"] { --panel-color: #d4d4d4; }
      .side-b [data-panel="location"] { --panel-color: #bdbdbd; }
      .side-b [data-panel="agenda"] { --panel-color: #a6a6a6; }
      .side-b [data-panel="liberatorie"] { --panel-color: #8f8f8f; }
      .side-b:not([data-panel-drag]):not([data-active="contributo"]):has([data-panel="contributo"]:not([data-peek-dismissed]) > .panel-title > button:focus-visible) { --contributo-row: calc(var(--peek-row) + var(--contributo-banner-height, 0px)); }
      .side-b:not([data-panel-drag]):not([data-active="location"]):has([data-panel="location"]:not([data-peek-dismissed]) > .panel-title > button:focus-visible) { --location-row: calc(var(--peek-row) + var(--location-banner-height, 0px)); }
      .side-b:not([data-panel-drag]):not([data-active="agenda"]):has([data-panel="agenda"]:not([data-peek-dismissed]) > .panel-title > button:focus-visible) { --agenda-row: calc(var(--peek-row) + var(--agenda-banner-height, 0px)); }
      .side-b:not([data-panel-drag]):not([data-active="liberatorie"]):has([data-panel="liberatorie"]:not([data-peek-dismissed]) > .panel-title > button:focus-visible) { --liberatorie-row: calc(var(--peek-row) + var(--liberatorie-banner-height, 0px)); }
      @media (hover: hover) {
        .side-b:not([data-panel-drag]):not([data-active="contributo"]):has([data-panel="contributo"]:not([data-peek-dismissed]):hover) { --contributo-row: calc(var(--peek-row) + var(--contributo-banner-height, 0px)); }
        .side-b:not([data-panel-drag]):not([data-active="location"]):has([data-panel="location"]:not([data-peek-dismissed]):hover) { --location-row: calc(var(--peek-row) + var(--location-banner-height, 0px)); }
        .side-b:not([data-panel-drag]):not([data-active="agenda"]):has([data-panel="agenda"]:not([data-peek-dismissed]):hover) { --agenda-row: calc(var(--peek-row) + var(--agenda-banner-height, 0px)); }
        .side-b:not([data-panel-drag]):not([data-active="liberatorie"]):has([data-panel="liberatorie"]:not([data-peek-dismissed]):hover) { --liberatorie-row: calc(var(--peek-row) + var(--liberatorie-banner-height, 0px)); }
      }

      .offer-small { font-size: var(--form-font-size); line-height: 1.2; }
      .offer-package { grid-column: 2; min-width: 0; }
      .offer-package h3 {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5em;
        margin: 0;
        font: inherit;
      }
      .offer-package h3 span:last-child { white-space: nowrap; }
      .offer-package > p { margin: 0.9rem 0 1.1rem; }
      .offer-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid currentColor; }
      .offer-list > div, .offer-list > li {
        display: grid;
        grid-template-columns: minmax(0, 42fr) minmax(0, 58fr);
        column-gap: 0.75rem;
        padding: 0.45rem 0;
        border-bottom: 1px solid currentColor;
      }
      .offer-list dt, .offer-list .offer-muted { opacity: var(--form-muted-opacity); }
      .offer-list dd { margin: 0; }
      .offer-notes { margin: 1.2rem 0 0; }
      .offer-notes p { margin: 0; }
      .offer-notes p + p { margin-top: 0.6rem; }
      .offer-photos {
        grid-column: 2;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
        margin: 0;
      }
      .offer-photos > * {
        aspect-ratio: 4 / 5;
        margin: 0;
        display: grid;
        place-items: center;
        border: 1px solid currentColor;
        text-align: center;
      }
      .offer-photos img { width: 100%; height: 100%; object-fit: cover; border: 0; }
      /* Link non valido o scaduto: la home del Side B da sola, tutta arancione. */
      .side-b-expired { grid-template-rows: 1fr; }
      .side-b-expired[hidden] { display: none; }
      .panel-content a { color: inherit; text-underline-offset: 0.15em; text-decoration-thickness: 1px; }

      @media (max-width: 720px) {
        .offer-package, .offer-photos { grid-column: auto; }
        .offer-photos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
    </style>

    <script>
      (async function () {
        const gate = document.querySelector("[data-side-b-gate]");
        const bytes = (text) => Uint8Array.from(atob(text.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
        const load = (src) => new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.body.append(script);
        });
        // Link non valido: si mostra la home "link scaduto", con lo stesso script del sito.
        const closed = () => {
          gate.hidden = false;
          load("../script.js?v=bounce-20261122-3");

        try {
          const key = location.hash.slice(1);
          const block = document.getElementById("side-b-payload");
          if (!/^[0-9a-f]{64}$/i.test(key) || !block || !window.crypto || !crypto.subtle) return closed();
          const [iv, data] = block.textContent.trim().split(".").map(bytes);
          const raw = Uint8Array.from(key.match(/../g), (pair) => parseInt(pair, 16));
          const cryptoKey = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);

          const today = new Date();

            old.replaceWith(fresh);

          gate.replaceWith(template.content);
          await load("../script.js?v=bounce-20261122-3");
